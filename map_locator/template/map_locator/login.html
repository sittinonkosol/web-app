<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแอดมิน — Map Locator</title>
    <link rel="stylesheet" href="{{ app_base }}/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(37, 99, 235, 0.18);
            border: 1px solid rgba(37, 99, 235, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .input-pw-wrap {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-pw-wrap input {
            width: 100%;
            padding-right: 44px;
        }

        .toggle-pw-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-pw-btn:hover {
            color: #fff;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-nav {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .back-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-nav a:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon-badge">🗺️</div>
            <h1 style="font-size: 22px; font-weight: 700;">เข้าสู่ระบบแอดมิน</h1>
            <p style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">Map Locator Management System</p>
        </div>

        {% if error_message %}
        <div class="error-alert">
            <span>⚠️</span>
            <span>{{ error_message }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{{ app_base }}/login">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="field">
                <label for="f-username">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="f-username" name="username" placeholder="กรอก Username ผู้ดูแล" required autofocus autocomplete="username">
            </div>

            <div class="field">
                <label for="f-password">รหัสผ่าน (Password)</label>
                <div class="input-pw-wrap">
                    <input type="password" id="f-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-pw-btn" id="toggle-pw" aria-label="Toggle password visibility">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-pin-btn" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); margin-top: 10px;">
                <span>เข้าสู่ระบบแอดมิน</span>
            </button>
        </form>

        <div class="back-nav">
            <a href="{{ app_base }}/">
                <span>←</span>
                <span>กลับสู่หน้าแผนที่ (Map Locator)</span>
            </a>
        </div>
    </div>

    <script>
        const pwInput = document.getElementById('f-password');
        const toggleBtn = document.getElementById('toggle-pw');
        const eyeSvg = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const eyeOffSvg = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        if (toggleBtn && pwInput) {
            toggleBtn.addEventListener('click', () => {
                if (pwInput.type === 'password') {
                    pwInput.type = 'text';
                    toggleBtn.innerHTML = eyeOffSvg;
                } else {
                    pwInput.type = 'password';
                    toggleBtn.innerHTML = eyeSvg;
                }
            });
        }
    </script>
</body>
</html>
